name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ExchangeWalletApi.slnx

      - name: Build
        run: dotnet build ExchangeWalletApi.slnx --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test Domain
        run: dotnet test tests/Domain.UnitTests/Domain.UnitTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build

      - name: Test Application
        run: dotnet test tests/Application.UnitTests/Application.UnitTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build

      - name: Test Infrastructure Integration
        run: dotnet test tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build

      - name: Test Architecture
        run: dotnet test tests/ArchitectureTests/ArchitectureTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build